# 主动敲门（Proactive Ping）示例配置
# 复制为 config.toml 后按需修改：cp config.example.toml config.toml
# 也可以直接在 WebUI → 插件 → 主动敲门 → 配置 里改（推荐）

[plugin]
config_version = "0.2.0"
enabled = true
# qq = QQ 私聊（走 qq-adapter）；internal = WebUI 内置聊天室
platform = "qq"
# 留空 = 自动取该平台下第一个私聊流。
# 多个账号/多个私聊时会自动抓第一个，若抓错请把日志里打印的完整 ID 填到这里。
stream_id = ""

[timing]
check_interval_minutes = 15   # 多久探测一次
idle_minutes = 20             # 连续多久没消息才考虑主动开口
cooldown_minutes = 20         # 两次主动之间的最短间隔
daily_max = 3                 # 每日上限，0 = 不限
quiet_start = "00:30"         # 静默时段（支持跨午夜，如 23:00~07:00）
quiet_end = "08:00"
startup_delay_seconds = 60    # 启动后延迟多久开始第一次探测

[prompt]
# 投递给 planner 的主动任务文本，可用占位符：{now} {idle_minutes} {count}
# 多行字符串用 """...""" 或 \n 转义均可。
intent_template = "【主动提醒】现在是 {now}。你们上一次说话是 {idle_minutes} 分钟前，那轮对话已经过去了，不要把它当成刚刚发生的对话来接。\n先看一眼最近的聊天记录和你记得的事，再自己判断要不要主动找他说话：\n- 如果要提起之前的事，必须带上时间感（比如「之前你说…」「刚才那个…」），不要无缝接着讲，否则会像一条延迟了很久的消息。\n- 更好的开场是：说说你此刻在做什么、想到什么，或者问问他现在在做什么。你可以有自己的当下（在发呆、在看视频、刚吃了什么），这些随你怎么说都行。\n- 但不要编造关于「他」的事实：他没说过的话、没做过的事、不存在的约定，都不要替他补。\n- 不要重复你最近说过的话或意思；同一件事不要换个说法再说一遍。\n- 觉得时机不对（他可能在忙、没什么可说、太晚了）就调用 stop()，不要勉强开口。\n不要解释这是定时触发，也不要提插件或提醒。今天你已经主动找过他 {count} 次。"